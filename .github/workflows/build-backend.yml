name: Build Backend Image

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 5 * * 1'

permissions:
  contents: read

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -f backend/Dockerfile.prod -t stock-scanner-backend:ci backend
      - name: Import application without services or network
        run: docker run --rm --network none stock-scanner-backend:ci python -c 'import backend.api_service.app'
